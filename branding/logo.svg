  <path d="M32.8 29.6V98.4" stroke="#2C9CCD" stroke-opacity=".4" stroke-width="6.25" stroke-linecap="round"/>
  <path d="M32.8 67.1L46.9 81.2L73.4 48.4" fill="none" stroke="#2C9CCD" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="32.8" cy="67.1" r="10.2" fill="#0B1620" stroke="#2C9CCD" stroke-width="6.25"/>
  <text x="122" y="86" font-family="Bricolage Grotesque, sans-serif" font-weight="700" font-size="64" letter-spacing="-1.6" fill="#0B1620">Commit Check</text>
</svg>
