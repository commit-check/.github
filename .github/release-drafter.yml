# https://github.com/release-drafter/release-drafter

name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: 💥 Breaking changes
    when:
      labels:
        - breaking
  - title: 🚀 Features
    when:
      labels:
        - feature
        - enhancement
  - title: 🐛 Bug fixes
    when:
      labels:
        - bug
        - bugfix
        - fix
        - regression
  - title: 📝 Documentation
    when:
      labels:
        - documentation
  - title: 🚦 Tests
    when:
      labels:
        - test
        - tests
  - title: 👻 Maintenance
    when:
      labels:
        - chore
        - internal
        - maintenance
  - title: 📦 Dependencies
    when:
      labels:
        - dependencies
    collapse-after: 15
  - title: 🗑 Removed
    when:
      labels:
        - removed
        - deprecated
  - title: ✍ Other changes
  # Dropped from the release notes before anything else runs
  - type: pre-exclude
    when:
      labels:
        - no-changelog
        - skip-changelog
        - invalid
        - duplicate
        - question
        - wontfix
  - type: version-resolver
    semver-increment: major
    when:
      label: major
  - type: version-resolver
    semver-increment: minor
    when:
      label: minor
  - type: version-resolver
    semver-increment: patch
    when:
      label: patch
  # Fallback when no version label is present
  - type: version-resolver
    semver-increment: patch

change-template: '- $TITLE by @$AUTHOR in #$NUMBER'

template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

autolabeler:
  # ── Title-based (conventional commit prefix) ──────────────
  - label: enhancement
    title:
      - /^feat(\(.*\))?:.*/
      - /^feature(\(.*\))?:.*/
      - /^perf(\(.*\))?:.*/
  - label: bug
    title:
      - /^fix(\(.*\))?:.*/
      - /^bugfix(\(.*\))?:.*/
  - label: documentation
    title:
      - /^docs(\(.*\))?:.*/
  - label: chore
    title:
      - /^chore(\(.*\))?:.*/
      - /^refactor(\(.*\))?:.*/
      - /^style(\(.*\))?:.*/
      - /^build(\(.*\))?:.*/
      - /^revert(\(.*\))?:.*/
  - label: tests
    title:
      - /^test(\(.*\))?:.*/
      - /^tests(\(.*\))?:.*/

  # ── Branch-based ──────────────────────────────────────────
  - label: enhancement
    branch:
      - /^feature\/.+/
      - /^feat\/.+/
  - label: bug
    branch:
      - /^fix\/.+/
      - /^bugfix\/.+/
  - label: chore
    branch:
      - /^chore\/.+/
  - label: tests
    branch:
      - /^test\/.+/
  - label: dependencies
    branch:
      - /^pre-commit-ci-update-config/
