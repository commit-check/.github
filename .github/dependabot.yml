# Dependabot version updates.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Same shape in every commit-check repository: monthly, one grouped pull
# request per ecosystem, `chore(deps)` commit subjects.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    # Explicit labels replace Dependabot's defaults, which include a
    # major/minor/patch label whenever the repository has one.
    labels:
      - "dependencies"
      - "github_actions"
    groups:
      github-actions:
        patterns:
          - "*"
