name: Bug report
description: Something went wrong
labels: ["bug"]
body:
  - type: textarea
    id: freeform
    attributes:
      label: Describe your issue
      placeholder: 'I was doing ... I ran ... I expected ... I got ...'
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The version of the CLI, Action or MCP server you ran.
      placeholder: commit-check 2.19.0, commit-check-action v2.18.0, ...
    validations:
      required: false
  - type: textarea
    id: configuration
    attributes:
      label: cchk.toml or commit-check.toml
      description: (auto-rendered as toml, no need for backticks)
      render: toml
    validations:
      required: false
