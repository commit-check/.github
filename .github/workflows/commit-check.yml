name: Commit Check

on:
  pull_request:
    branches: 'main'
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

jobs:
  commit-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Required for merge-base checks
          # Nothing after checkout needs authenticated git.
          persist-credentials: false
      - uses: commit-check/commit-check-action@b6819c7bfd40f576d670a78712646a67f2659ff3 # v2.18.2
        with:
          message: true
          branch: true
          job-summary: true
          pr-comments: true
          pr-title: true
